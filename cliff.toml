# git-cliff configuration for changelog generation
# https://git-cliff.org/docs/configuration
#
# Skills repo variant: group by commit scope (skill name) first,
# then list commits within each scope tagged by type. This matches
# the "## X.Y.Z → ### <skill-name> → bullets" structure of CHANGELOG.md.

[changelog]
header = ""
body = """
{% for scope, commits in commits | group_by(attribute="scope") | sort %}
{% if scope %}
### {{ scope }}
{% else %}
### general
{% endif %}
{% for commit in commits | sort(attribute="group") %}
- [{{ commit.group }}] {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "feat" },
    { message = "^fix", group = "fix" },
    { message = "^docs", group = "docs" },
    { message = "^perf", group = "perf" },
    { message = "^refactor", group = "refactor" },
    { message = "^revert", group = "revert" },
    { message = "^.*[Bb]ump", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
]
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
